name: Build, Push, and Export Godot Project

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_IMAGE: derricka20/qv-world

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      dev_tag: ${{ steps.meta.outputs.dev_tag }}
      export_tag: ${{ steps.meta.outputs.export_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "dev_tag=${{ env.REGISTRY_IMAGE }}:dev-${SHA}" >> "$GITHUB_OUTPUT"
          echo "export_tag=${{ env.REGISTRY_IMAGE }}:export-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: godot-dev
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_IMAGE }}:dev
            ${{ steps.meta.outputs.dev_tag }}

      - name: Build & push export image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: godot-export
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY_IMAGE }}:export
            ${{ steps.meta.outputs.export_tag }}

  export-game:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create export output dir
        run: mkdir -p export

      - name: Run headless Godot export
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            ${{ env.REGISTRY_IMAGE }}:export \
            --headless --export-debug "Linux" export/qv-world.x86_64

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: qv-world-linux-export
          path: export/
          retention-days: 14
